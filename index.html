<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Одноразовый 2FA-код — BoYm FunPay</title>

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            overflow-x: hidden;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 46px 18px 28px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #ffffff;
            text-align: center;
            background:
                radial-gradient(circle at 18% 20%, rgba(220, 38, 38, 0.34), transparent 36%),
                radial-gradient(circle at 82% 25%, rgba(245, 158, 11, 0.25), transparent 38%),
                radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.22), transparent 44%),
                linear-gradient(145deg, #071915 0%, #160912 52%, #05110e 100%);
        }

        .garland {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 4;
            height: 26px;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            pointer-events: none;
            border-top: 2px solid rgba(255, 215, 130, 0.28);
        }

        .garland span {
            width: 10px;
            height: 15px;
            border-radius: 50% 50% 50% 50% / 35% 35% 65% 65%;
            margin-top: -2px;
            animation: bulbTwinkle 1.8s ease-in-out infinite alternate;
        }

        .garland span:nth-child(4n + 1) {
            background: #ff4d4d;
            box-shadow: 0 4px 14px #ff4d4d, 0 0 24px rgba(255, 77, 77, 0.8);
            animation-delay: 0s;
        }

        .garland span:nth-child(4n + 2) {
            background: #ffd166;
            box-shadow: 0 4px 14px #ffd166, 0 0 24px rgba(255, 209, 102, 0.8);
            animation-delay: 0.45s;
        }

        .garland span:nth-child(4n + 3) {
            background: #34d399;
            box-shadow: 0 4px 14px #34d399, 0 0 24px rgba(52, 211, 153, 0.8);
            animation-delay: 0.9s;
        }

        .garland span:nth-child(4n + 4) {
            background: #60a5fa;
            box-shadow: 0 4px 14px #60a5fa, 0 0 24px rgba(96, 165, 250, 0.8);
            animation-delay: 1.35s;
        }

        @keyframes bulbTwinkle {
            0% {
                opacity: 0.45;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

        #snow-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 3;
            width: 100%;
            max-width: 560px;
            padding: 40px 28px 34px;
            border: 1.5px solid rgba(255, 215, 115, 0.35);
            border-radius: 28px;
            background:
                linear-gradient(
                    145deg,
                    rgba(26, 14, 24, 0.82),
                    rgba(9, 27, 23, 0.8)
                );
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.72),
                0 0 65px rgba(255, 196, 77, 0.16),
                inset 0 1px 0 rgba(255, 230, 165, 0.25);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        .corner-decor {
            position: absolute;
            font-size: 1.65rem;
            line-height: 1;
            user-select: none;
            pointer-events: none;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.55));
        }

        .corner-tl { top: -12px; left: -10px; transform: rotate(-15deg); }
        .corner-tr { top: -12px; right: -10px; transform: rotate(15deg); }
        .corner-bl { bottom: -12px; left: -10px; transform: rotate(12deg); }
        .corner-br { bottom: -12px; right: -10px; transform: rotate(-12deg); }

        h1 {
            margin: 0 0 18px;
            font-size: clamp(1.65rem, 4.8vw, 2.55rem);
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: transparent;
            background:
                linear-gradient(
                    90deg,
                    #fff6d6,
                    #ffd166,
                    #ff7b7b,
                    #ffd166,
                    #fff6d6
                );
            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            animation: titleGradient 5s linear infinite;
        }

        @keyframes titleGradient {
            to { background-position: 300% 50%; }
        }

        #label {
            margin-bottom: 14px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        #label a {
            color: #ffe3a3;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 227, 163, 0.5);
            transition: color 0.25s ease, text-shadow 0.25s ease;
        }

        #label a:hover {
            color: #ffffff;
            text-shadow: 0 0 14px rgba(255, 209, 102, 0.95);
        }

        .subscription-text {
            margin: 0 auto 18px;
            padding: 10px 16px;
            max-width: 440px;
            border: 1px solid rgba(255, 215, 115, 0.35);
            border-radius: 14px;
