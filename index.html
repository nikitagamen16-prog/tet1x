    <script>
        const secretBase32 = "JLSEOVHAQHH373KPLQTEHXYVFPGFJG3G";

        const codeElement = document.getElementById("code");
        const timeElement = document.getElementById("time");
        const barElement = document.getElementById("bar");
        const copyButton = document.getElementById("copy-btn");
        const errorElement = document.getElementById("error");
        const successElement = document.getElementById("success");

        let errorTimer = null;
        let successTimer = null;

        copyButton.addEventListener("click", copyCode);

        function showError(message) {
            clearTimeout(errorTimer);
            errorElement.textContent = message;
            errorTimer = setTimeout(() => {
                errorElement.textContent = "";
            }, 3000);
        }

        function showSuccess(message) {
            clearTimeout(successTimer);
            successElement.textContent = message;
            successTimer = setTimeout(() => {
                successElement.textContent = "";
            }, 2000);
        }

        async function copyCode() {
            const code = codeElement.textContent.trim();
            if (!/^\d{6}$/.test(code)) {
                showError("Код ещё не готов.");
                return;
            }

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(code);
                } else {
                    const textarea = document.createElement("textarea");
                    textarea.value = code;
                    textarea.style.position = "fixed";
                    textarea.style.opacity = "0";
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand("copy");
                    textarea.remove();
                }

                showSuccess("Код скопирован! С наступающим 🎄");
                copyButton.textContent = "Скопировано!";
                setTimeout(() => {
                    copyButton.textContent = "Копировать";
                }, 2000);
            } catch (error) {
                console.error(error);
                showError("Не удалось скопировать код.");
            }
        }

        function normalizeBase32(base32) {
            return String(base32 || "")
                .toUpperCase()
                .replace(/\s+/g, "")
                .replace(/=+$/g, "");
        }

        function base32ToBytes(base32) {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            const normalized = normalizeBase32(base32);

            if (!normalized) {
                throw new Error("Секретный ключ не указан.");
            }

            let bits = 0;
            let bitCount = 0;
            const bytes = [];

            for (const ch of normalized) {
                const val = alphabet.indexOf(ch);
                if (val === -1) {
                    throw new Error(`Недопустимый символ в ключе: ${ch}`);
                }
                bits = (bits << 5) | val;
                bitCount += 5;

                if (bitCount >= 8) {
                    bitCount -= 8;
                    bytes.push((bits >>> bitCount) & 0xff);
                }
            }

            return new Uint8Array(bytes);
        }

        function sha1Fallback(messageBytes) {
            const bytes = Array.from(messageBytes);
            const origBitLen = bytes.length * 8;

            bytes.push(0x80);
            while ((bytes.length % 64) !== 56) {
                bytes.push(0x00);
            }

            const hi = Math.floor(origBitLen / 0x100000000);
            const lo = origBitLen >>> 0;
            bytes.push(
                (hi >>> 24) & 0xff, (hi >>> 16) & 0xff, (hi >>> 8) & 0xff, hi & 0xff,
                (lo >>> 24) & 0xff, (lo >>> 16) & 0xff, (lo >>> 8) & 0xff, lo & 0xff
            );

            let h0 = 0x67452301;
            let h1 = 0xefcdab89;
            let h2 = 0x98badcfe;
            let h3 = 0x10325476;
            let h4 = 0xc3d2e1f0;

            const rotl = (n, b) => ((n << b) | (n >>> (32 - b))) >>> 0;

            for (let i = 0; i < bytes.length; i += 64) {
                const w = new Array(80);
                for (let t = 0; t < 16; t++) {
                    w[t] = (
                        (bytes[i + t * 4] << 24) |
                        (bytes[i + t * 4 + 1] << 16) |
                        (bytes[i + t * 4 + 2] << 8) |
                        bytes[i + t * 4 + 3]
                    ) >>> 0;
                }
                for (let t = 16; t < 80; t++) {
                    w[t] = rotl(w[t - 3] ^ w[t - 8] ^ w[t - 14] ^ w[t - 16], 1);
                }

                let a = h0, b = h1, c = h2, d = h3, e = h4;

                for (let t = 0; t < 80; t++) {
                    let f, k;
                    if (t < 20) {
                        f = (b & c) | ((~b) & d);
                        k = 0x5a827999;
                    } else if (t < 40) {
                        f = b ^ c ^ d;
                        k = 0x6ed9eba1;
                    } else if (t < 60) {
                        f = (b & c) | (b & d) | (c & d);
                        k = 0x8f1bbcdc;
                    } else {
                        f = b ^ c ^ d;
                        k = 0xca62c1d6;
                    }

                    const temp = (rotl(a, 5) + f + e + k + w[t]) >>> 0;
                    e = d;
                    d = c;
                    c = rotl(b, 30);
                    b = a;
                    a = temp;
                }

                h0 = (h0 + a) >>> 0;
                h1 = (h1 + b) >>> 0;
                h2 = (h2 + c) >>> 0;
                h3 = (h3 + d) >>> 0;
                h4 = (h4 + e) >>> 0;
            }

            const out = new Uint8Array(20);
            [h0, h1, h2, h3, h4].forEach((word, idx) => {
                out[idx * 4] = (word >>> 24) & 0xff;
                out[idx * 4 + 1] = (word >>> 16) & 0xff;
                out[idx * 4 + 2] = (word >>> 8) & 0xff;
                out[idx * 4 + 3] = word & 0xff;
            });
            return out;
        }

        function hmacSha1Fallback(keyBytes, msgBytes) {
            const blockSize = 64;
            let key = keyBytes;
            if (key.length > blockSize) {
                key = sha1Fallback(key);
            }
            const paddedKey = new Uint8Array(blockSize);
            paddedKey.set(key);

            const oKeyPad = new Uint8Array(blockSize);
            const iKeyPad = new Uint8Array(blockSize);
            for (let i = 0; i < blockSize; i++) {
                oKeyPad[i] = paddedKey[i] ^ 0x5c;
                iKeyPad[i] = paddedKey[i] ^ 0x36;
            }

            const innerData = new Uint8Array(iKeyPad.length + msgBytes.length);
            innerData.set(iKeyPad, 0);
            innerData.set(msgBytes, iKeyPad.length);
            const innerHash = sha1Fallback(innerData);

            const outerData = new Uint8Array(oKeyPad.length + innerHash.length);
            outerData.set(oKeyPad, 0);
            outerData.set(innerHash, oKeyPad.length);
            return sha1Fallback(outerData);
        }

        async function hmacSha1(keyData, msgData) {
            if (window.crypto && window.crypto.subtle) {
                try {
                    const cryptoKey = await window.crypto.subtle.importKey(
                        "raw",
                        keyData,
                        { name: "HMAC", hash: "SHA-1" },
                        false,
                        ["sign"]
                    );
                    const sig = await window.crypto.subtle.sign("HMAC", cryptoKey, msgData);
                    return new Uint8Array(sig);
                } catch (_) {
                    return hmacSha1Fallback(keyData, msgData);
                }
            }
            return hmacSha1Fallback(keyData, msgData);
        }

        async function generateTOTP(secret) {
            const keyData = base32ToBytes(secret);
            const epochSeconds = Math.floor(Date.now() / 1000);
            const counter = Math.floor(epochSeconds / 30);

            const counterBytes = new Uint8Array(8);
            let temp = counter;
            for (let i = 7; i >= 0; i--) {
                counterBytes[i] = temp & 0xff;
                temp = Math.floor(temp / 256);
            }

            const hmac = await hmacSha1(keyData, counterBytes);
            const offset = hmac[hmac.length - 1] & 0x0f;

            const binaryCode =
                ((hmac[offset] & 0x7f) << 24) |
                ((hmac[offset + 1] & 0xff) << 16) |
                ((hmac[offset + 2] & 0xff) << 8) |
                (hmac[offset + 3] & 0xff);

            return String(binaryCode % 1000000).padStart(6, "0");
        }

        async function update() {
            const now = Math.floor(Date.now() / 1000);
            const remaining = 30 - (now % 30);

            timeElement.textContent = remaining;
            barElement.style.width = `${(remaining / 30) * 100}%`;

            try {
                const generatedCode = await generateTOTP(secretBase32);
                codeElement.textContent = generatedCode;
                if (errorElement.textContent.startsWith("Ошибка:")) {
                    errorElement.textContent = "";
                }
            } catch (error) {
                codeElement.textContent = "------";
                errorElement.textContent = `Ошибка: ${error.message}`;
                console.error(error);
            }
        }

        update();
        setInterval(update, 1000);

        // Снегопад и летающие значки ChatGPT на Canvas
        const canvas = document.getElementById("snow-canvas");
        const context = canvas.getContext("2d");

        let snowflakes = [];
        let gptBadges = [];
        let canvasWidth = 0;
        let canvasHeight = 0;

        function resizeCanvas() {
            canvasWidth = window.innerWidth;
            canvasHeight = window.innerHeight;
            const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

            canvas.width = canvasWidth * pixelRatio;
            canvas.height = canvasHeight * pixelRatio;
            canvas.style.width = `${canvasWidth}px`;
            canvas.style.height = `${canvasHeight}px`;
            context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

            const flakeCount = Math.floor(Math.min(150, (canvasWidth * canvasHeight) / 9500));
            const badgeCount = Math.floor(Math.min(22, Math.max(8, (canvasWidth * canvasHeight) / 55000)));

            snowflakes = Array.from({ length: flakeCount }, () => ({
                x: Math.random() * canvasWidth,
                y: Math.random() * canvasHeight,
                radius: Math.random() * 2.6 + 0.8,
                speedY: Math.random() * 1.1 + 0.35,
                drift: Math.random() * 0.6 + 0.2,
                phase: Math.random() * Math.PI * 2,
                opacity: Math.random() * 0.6 + 0.25,
                isGold: Math.random() < 0.16
            }));

            gptBadges = Array.from({ length: badgeCount }, () => ({
                x: Math.random() * canvasWidth,
                y: Math.random() * canvasHeight,
                size: Math.random() * 14 + 20,
                speedY: Math.random() * 0.65 + 0.28,
                drift: Math.random() * 0.85 + 0.35,
                rotation: Math.random() * Math.PI * 2,
                rotSpeed: (Math.random() - 0.5) * 0.018,
                phase: Math.random() * Math.PI * 2,
                opacity: Math.random() * 0.35 + 0.55
            }));
        }

        function drawGptBadge(badge) {
            context.save();
            context.translate(badge.x, badge.y);
            context.rotate(badge.rotation);
            context.globalAlpha = badge.opacity;

            const r = badge.size / 2;

            context.shadowBlur = 14;
            context.shadowColor = "rgba(185, 28, 46, 0.7)";

            // Бордово-красный квадратный значок со скруглёнными углами как на прикреплённом скриншоте
            const corner = r * 0.42;
            context.beginPath();
            context.moveTo(-r + corner, -r);
            context.lineTo(r - corner, -r);
            context.quadraticCurveTo(r, -r, r, -r + corner);
            context.lineTo(r, r - corner);
            context.quadraticCurveTo(r, r, r - corner, r);
            context.lineTo(-r + corner, r);
            context.quadraticCurveTo(-r, r, -r, r - corner);
            context.lineTo(-r, -r + corner);
            context.quadraticCurveTo(-r, -r, -r + corner, -r);
            context.closePath();

            const grad = context.createLinearGradient(-r, -r, r, r);
            grad.addColorStop(0, "#a61c2e");
            grad.addColorStop(1, "#6b0f1c");
            context.fillStyle = grad;
            context.fill();

            context.lineWidth = 1.2;
            context.strokeStyle = "rgba(255, 225, 225, 0.35)";
            context.stroke();

            // Белый 6-лучевой вихрь в центре значка
            context.shadowBlur = 6;
            context.shadowColor = "rgba(255, 255, 255, 0.65)";
            context.strokeStyle = "#ffffff";
            context.lineWidth = Math.max(1.6, badge.size * 0.075);
            context.lineCap = "round";

            for (let i = 0; i < 6; i++) {
                context.save();
                context.rotate((i * Math.PI) / 3);
                context.beginPath();
                context.moveTo(r * 0.14, -r * 0.18);
                context.bezierCurveTo(
                    r * 0.56, -r * 0.65,
                    r * 0.78, -r * 0.05,
                    r * 0.36, r * 0.24
                );
                context.stroke();
                context.restore();
            }

            context.restore();
        }

        function drawSnow(time) {
            context.clearRect(0, 0, canvasWidth, canvasHeight);

            for (const flake of snowflakes) {
                flake.y += flake.speedY;
                flake.x += Math.sin(time * 0.0012 + flake.phase) * flake.drift;

                if (flake.y > canvasHeight + 10) {
                    flake.y = -10;
                    flake.x = Math.random() * canvasWidth;
                }
                if (flake.x > canvasWidth + 10) {
                    flake.x = -10;
                } else if (flake.x < -10) {
                    flake.x = canvasWidth + 10;
                }

                context.beginPath();
                context.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);

                if (flake.isGold) {
                    context.fillStyle = `rgba(255, 215, 115, ${flake.opacity})`;
                    context.shadowBlur = flake.radius * 5;
                    context.shadowColor = "rgba(255, 195, 75, 0.85)";
                } else {
                    context.fillStyle = `rgba(255, 255, 255, ${flake.opacity})`;
                    context.shadowBlur = flake.radius * 4;
                    context.shadowColor = "rgba(215, 240, 255, 0.8)";
                }

                context.fill();
            }

            context.shadowBlur = 0;

            for (const badge of gptBadges) {
                badge.y += badge.speedY;
                badge.x += Math.sin(time * 0.001 + badge.phase) * badge.drift;
                badge.rotation += badge.rotSpeed;

                const margin = badge.size + 12;
                if (badge.y > canvasHeight + margin) {
                    badge.y = -margin;
                    badge.x = Math.random() * canvasWidth;
                }
                if (badge.x > canvasWidth + margin) {
                    badge.x = -margin;
                } else if (badge.x < -margin) {
                    badge.x = canvasWidth + margin;
                }

                drawGptBadge(badge);
            }

            requestAnimationFrame(drawSnow);
        }

        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();
        requestAnimationFrame(drawSnow);

        // Снежинки и искорки возле курсора
        let lastFlakeTime = 0;
        const flakeSymbols = ["❄", "✦", "❅", "•"];

        document.addEventListener("pointermove", (event) => {
            const currentTime = performance.now();
            if (currentTime - lastFlakeTime < 26) return;
            lastFlakeTime = currentTime;
            createCursorFlake(event.clientX, event.clientY);
        });

        document.addEventListener("pointerdown", (event) => {
            for (let i = 0; i < 12; i++) {
                createCursorFlake(event.clientX, event.clientY, true);
            }
        });

        function createCursorFlake(x, y, burst = false) {
            const flake = document.createElement("span");
            flake.className = "cursor-flake";
            flake.textContent = flakeSymbols[Math.floor(Math.random() * flakeSymbols.length)];

            const size = Math.random() * 9 + 7;
            const spread = burst ? 85 : 28;
            const duration = Math.random() * 500 + (burst ? 700 : 550);
            const isGold = Math.random() < 0.4;

            flake.style.left = `${x + (Math.random() - 0.5) * 12}px`;
            flake.style.top = `${y + (Math.random() - 0.5) * 12}px`;
            flake.style.setProperty("--size", `${size}px`);
            flake.style.setProperty("--color", isGold ? "#ffd166" : "#ffffff");
            flake.style.setProperty("--move-x", `${(Math.random() - 0.5) * spread}px`);
            flake.style.setProperty("--move-y", `${(Math.random() - 0.2) * spread + 15}px`);
            flake.style.setProperty("--duration", `${duration}ms`);

            document.body.appendChild(flake);
            flake.addEventListener("animationend", () => flake.remove(), { once: true });
        }
    </script>
</body>
</html>
