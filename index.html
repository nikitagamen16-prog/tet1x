<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Одноразовый 2FA-код — BoYm FunPay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px 90px;

            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #ffffff;
            text-align: center;

            background:
                radial-gradient(circle at 20% 25%, rgba(114, 53, 255, 0.35), transparent 34%),
                radial-gradient(circle at 80% 70%, rgba(0, 142, 255, 0.28), transparent 36%),
                radial-gradient(circle at 50% 100%, rgba(255, 0, 153, 0.15), transparent 42%),
                linear-gradient(135deg, #02010a 0%, #070523 50%, #010208 100%);
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: -50%;
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            background:
                radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.9) 0 1px,
                    transparent 1.5px
                );

            background-size: 55px 55px;
            opacity: 0.45;

            animation: starsMove 55s linear infinite;
        }

        body::after {
            background:
                radial-gradient(
                    circle,
                    rgba(153, 210, 255, 0.8) 0 1px,
                    transparent 2px
                );

            background-size: 95px 95px;
            opacity: 0.3;

            transform: rotate(25deg);

            animation: starsMoveBack 80s linear infinite;
        }

        @keyframes starsMove {
            to {
                transform: translate3d(220px, 220px, 0);
            }
        }

        @keyframes starsMoveBack {
            to {
                transform: rotate(25deg) translate3d(-250px, 180px, 0);
            }
        }

        #space-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;

            width: 100%;
            height: 100%;

            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 3;

            width: 100%;
            max-width: 560px;

            padding: 42px 32px;

            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 28px;

            background:
                linear-gradient(
                    135deg,
                    rgba(20, 15, 55, 0.74),
                    rgba(4, 8, 30, 0.68)
                );

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.65),
                0 0 80px rgba(96, 72, 255, 0.15),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
        }

        h1 {
            margin: 0 0 25px;

            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;

            color: transparent;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #a8ccff,
                    #c7a8ff,
                    #ffffff
                );

            background-size: 300% 100%;
            background-clip: text;
            -webkit-background-clip: text;

            animation: titleGradient 5s linear infinite;
        }

        @keyframes titleGradient {
            to {
                background-position: 300% 50%;
            }
        }

        #label {
            margin-bottom: 30px;

            font-size: 1.25rem;
            font-weight: 600;
        }

        #label a {
            color: #b9d8ff;
            text-decoration: none;

            border-bottom: 1px solid rgba(185, 216, 255, 0.5);

            transition:
                color 0.25s ease,
                text-shadow 0.25s ease;
        }

        #label a:hover {
            color: #ffffff;

            text-shadow:
                0 0 12px rgba(132, 190, 255, 0.9);
        }

        #code {
            min-height: 110px;
            margin: 30px 0 24px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: clamp(3.3rem, 12vw, 5.8rem);
            font-weight: 900;
            letter-spacing: clamp(5px, 2vw, 13px);

            text-shadow:
                0 0 10px #ffffff,
                0 0 25px rgba(132, 190, 255, 0.95),
                0 0 55px rgba(116, 67, 255, 0.8);

            animation: codeGlow 2.3s ease-in-out infinite;
        }

        @keyframes codeGlow {
            50% {
                transform: scale(1.025);
            }
        }

        .progress {
            width: min(350px, 100%);
            height: 10px;

            margin: 20px auto;

            overflow: hidden;

            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.08);
        }

        .bar {
            width: 100%;
            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #665cff,
                    #39a9ff,
                    #d98cff,
                    #ffffff
                );

            background-size: 250% 100%;

            box-shadow:
                0 0 20px rgba(89, 160, 255, 0.9);

            transition: width 1s linear;

            animation: barMove 3s linear infinite;
        }

        @keyframes barMove {
            to {
                background-position: 250% 50%;
            }
        }

        #countdown {
            margin-bottom: 24px;

            font-size: 1.2rem;

            color: rgba(255, 255, 255, 0.84);
        }

        #time {
            color: #b5d9ff;
            font-weight: 800;
        }

        #copy-btn {
            margin-top: 10px;
            padding: 15px 36px;

            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 12px;

            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    rgba(67, 102, 255, 0.9),
                    rgba(138, 65, 255, 0.9)
                );

            box-shadow:
                0 8px 30px rgba(76, 79, 255, 0.35);

            cursor: pointer;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease;
        }

        #copy-btn:hover {
            transform: translateY(-3px) scale(1.04);

            box-shadow:
                0 12px 42px rgba(77, 126, 255, 0.55);
        }

        #copy-btn:active {
            transform: scale(0.97);
        }

        .error,
        .success {
            min-height: 24px;
            margin-top: 14px;

            font-size: 1rem;
            font-weight: 600;
        }

        .error {
            color: #ff7a9b;
        }

        .success {
            color: #82ffcf;
        }

        .warning-text {
            position: fixed;
            z-index: 4;

            left: 50%;
            bottom: 22px;

            width: calc(100% - 30px);
            max-width: 850px;

            padding: 12px 18px;

            color: rgba(255, 255, 255, 0.86);
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.5;

            transform: translateX(-50%);

            text-shadow:
                0 0 10px rgba(100, 170, 255, 0.65),
                0 0 20px rgba(140, 80, 255, 0.45);
        }

        .cursor-star {
            position: fixed;
            z-index: 9999;

            left: 0;
            top: 0;

            width: var(--size);
            height: var(--size);

            border-radius: 50%;

            background: #ffffff;

            box-shadow:
                0 0 6px #ffffff,
                0 0 12px #78bdff,
                0 0 22px #985cff;

            pointer-events: none;

            transform: translate(-50%, -50%);

            animation:
                cursorStarFade var(--duration) ease-out forwards;
        }

        @keyframes cursorStarFade {
            to {
                opacity: 0;

                transform:
                    translate(
                        calc(-50% + var(--move-x)),
                        calc(-50% + var(--move-y))
                    )
                    scale(0)
                    rotate(180deg);
            }
        }

        @media (max-width: 600px) {
            body {
                overflow-y: auto;

                padding: 20px 14px;

                flex-direction: column;
            }

            .container {
                padding: 34px 18px;

                border-radius: 22px;
            }

            .warning-text {
                position: relative;

                left: auto;
                bottom: auto;

                margin-top: 24px;
                padding: 10px 5px;

                font-size: 0.82rem;

                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>
    <canvas id="space-canvas"></canvas>

    <main class="container">
        <h1>Одноразовый 2FA-код</h1>

        <div id="label">
            <a
                href="https://funpay.com/users/2176322/"
                target="_blank"
                rel="noopener noreferrer"
            >
                BoYm - FunPay
            </a>
        </div>

        <div id="code" aria-live="polite">
            ------
        </div>

        <div class="progress">
            <div id="bar" class="bar"></div>
        </div>

        <div id="countdown">
            Обновление через
            <span id="time">30</span>
            сек.
        </div>

        <button id="copy-btn" type="button">
            Копировать
        </button>

        <div
            id="error"
            class="error"
            aria-live="assertive"
        ></div>

        <div
            id="success"
            class="success"
            aria-live="polite"
        ></div>
    </main>

    <div class="warning-text">
        Если вы купили данный аккаунт у другого продавца, смело кидайте жалобу, и вам вернут средства.
    </div>

    <script>
        // Вставь сюда новый секретный ключ 2FA в формате Base32.
        const secretBase32 =
            "CWNQVHWMCKGZ7GGGDDGQHWXAO5HXBIM3";

        const codeElement =
            document.getElementById("code");

        const timeElement =
            document.getElementById("time");

        const barElement =
            document.getElementById("bar");

        const copyButton =
            document.getElementById("copy-btn");

        const errorElement =
            document.getElementById("error");

        const successElement =
            document.getElementById("success");

        copyButton.addEventListener(
            "click",
            copyCode
        );

        async function copyCode() {
            const code =
                codeElement.textContent.trim();

            if (!/^\d{6}$/.test(code)) {
                showError("Код ещё не готов.");
                return;
            }

            try {
                await navigator.clipboard.writeText(code);

                showSuccess("Код скопирован.");

                copyButton.textContent =
                    "Скопировано!";

                setTimeout(() => {
                    copyButton.textContent =
                        "Копировать";
                }, 2000);
            } catch (error) {
                console.error(error);

                showError(
                    "Не удалось скопировать код."
                );
            }
        }

        function showError(message) {
            errorElement.textContent = message;

            setTimeout(() => {
                errorElement.textContent = "";
            }, 3000);
        }

        function showSuccess(message) {
            successElement.textContent = message;

            setTimeout(() => {
                successElement.textContent = "";
            }, 2000);
        }

        function normalizeBase32(base32) {
            return base32
                .toUpperCase()
                .replace(/\s+/g, "")
                .replace(/=+$/g, "");
        }

        function base32ToBuffer(base32) {
            const alphabet =
                "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";

            const normalized =
                normalizeBase32(base32);

            if (!normalized) {
                throw new Error(
                    "Секретный ключ не указан."
                );
            }

            let bits = "";

            for (const character of normalized) {
                const value =
                    alphabet.indexOf(character);

                if (value === -1) {
                    throw new Error(
                        `Недопустимый символ в ключе: ${character}`
                    );
                }

                bits += value
                    .toString(2)
                    .padStart(5, "0");
            }

            const byteLength =
                Math.floor(bits.length / 8);

            const bytes =
                new Uint8Array(byteLength);

            for (
                let i = 0;
                i < byteLength;
                i++
            ) {
                bytes[i] = parseInt(
                    bits.slice(
                        i * 8,
                        i * 8 + 8
                    ),
                    2
                );
            }

            return bytes;
        }

        async function generateTOTP(secret) {
            const keyData =
                base32ToBuffer(secret);

            const epochSeconds =
                Math.floor(Date.now() / 1000);

            const counter =
                Math.floor(epochSeconds / 30);

            const counterBuffer =
                new ArrayBuffer(8);

            const counterView =
                new DataView(counterBuffer);

            counterView.setBigUint64(
                0,
                BigInt(counter),
                false
            );

            const cryptoKey =
                await crypto.subtle.importKey(
                    "raw",
                    keyData,
                    {
                        name: "HMAC",
                        hash: "SHA-1"
                    },
                    false,
                    ["sign"]
                );

            const signature =
                await crypto.subtle.sign(
                    "HMAC",
                    cryptoKey,
                    counterBuffer
                );

            const hmac =
                new Uint8Array(signature);

            const offset =
                hmac[hmac.length - 1] & 0x0f;

            const binaryCode =
                ((hmac[offset] & 0x7f) << 24) |
                ((hmac[offset + 1] & 0xff) << 16) |
                ((hmac[offset + 2] & 0xff) << 8) |
                (hmac[offset + 3] & 0xff);

            return String(
                binaryCode % 1000000
            ).padStart(6, "0");
        }

        async function update() {
            const now =
                Math.floor(Date.now() / 1000);

            const remaining =
                30 - (now % 30);

            timeElement.textContent =
                remaining;

            barElement.style.width =
                `${(remaining / 30) * 100}%`;

            try {
                const generatedCode =
                    await generateTOTP(
                        secretBase32
                    );

                codeElement.textContent =
                    generatedCode;

                errorElement.textContent = "";
            } catch (error) {
                codeElement.textContent =
                    "------";

                errorElement.textContent =
                    `Ошибка: ${error.message}`;

                console.error(error);
            }
        }

        update();

        setInterval(
            update,
            1000
        );

        // Фоновые звёзды

        const canvas =
            document.getElementById(
                "space-canvas"
            );

        const context =
            canvas.getContext("2d");

        let stars = [];
        let canvasWidth = 0;
        let canvasHeight = 0;

        function resizeCanvas() {
            canvasWidth =
                window.innerWidth;

            canvasHeight =
                window.innerHeight;

            const pixelRatio =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );

            canvas.width =
                canvasWidth * pixelRatio;

            canvas.height =
                canvasHeight * pixelRatio;

            canvas.style.width =
                `${canvasWidth}px`;

            canvas.style.height =
                `${canvasHeight}px`;

            context.setTransform(
                pixelRatio,
                0,
                0,
                pixelRatio,
                0,
                0
            );

            const starCount =
                Math.floor(
                    Math.min(
                        220,
                        (
                            canvasWidth *
                            canvasHeight
                        ) / 7000
                    )
                );

            stars = Array.from(
                {
                    length: starCount
                },
                () => ({
                    x:
                        Math.random() *
                        canvasWidth,

                    y:
                        Math.random() *
                        canvasHeight,

                    radius:
                        Math.random() *
                        1.7 + 0.2,

                    opacity:
                        Math.random() *
                        0.8 + 0.2,

                    speed:
                        Math.random() *
                        0.025 + 0.008,

                    phase:
                        Math.random() *
                        Math.PI * 2
                })
            );
        }

        function drawStars(time) {
            context.clearRect(
                0,
                0,
                canvasWidth,
                canvasHeight
            );

            for (const star of stars) {
                const twinkle =
                    Math.sin(
                        time * star.speed +
                        star.phase
                    ) * 0.35 + 0.65;

                context.beginPath();

                context.arc(
                    star.x,
                    star.y,
                    star.radius,
                    0,
                    Math.PI * 2
                );

                context.fillStyle =
                    `rgba(210, 230, 255, ${
                        star.opacity * twinkle
                    })`;

                context.shadowBlur =
                    star.radius * 6;

                context.shadowColor =
                    "rgba(130, 180, 255, 0.9)";

                context.fill();
            }

            context.shadowBlur = 0;

            requestAnimationFrame(
                drawStars
            );
        }

        window.addEventListener(
            "resize",
            resizeCanvas
        );

        resizeCanvas();

        requestAnimationFrame(
            drawStars
        );

        // Звёзды возле курсора

        let lastStarTime = 0;

        document.addEventListener(
            "pointermove",
            event => {
                const currentTime =
                    performance.now();

                if (
                    currentTime -
                    lastStarTime <
                    22
                ) {
                    return;
                }

                lastStarTime =
                    currentTime;

                createCursorStar(
                    event.clientX,
                    event.clientY
                );
            }
        );

        document.addEventListener(
            "pointerdown",
            event => {
                for (
                    let i = 0;
                    i < 12;
                    i++
                ) {
                    createCursorStar(
                        event.clientX,
                        event.clientY,
                        true
                    );
                }
            }
        );

        function createCursorStar(
            x,
            y,
            burst = false
        ) {
            const star =
                document.createElement("span");

            star.className =
                "cursor-star";

            const size =
                Math.random() * 4 + 2;

            const spread =
                burst ? 75 : 24;

            const duration =
                Math.random() * 450 +
                (burst ? 650 : 500);

            star.style.left =
                `${
                    x +
                    (
                        Math.random() -
                        0.5
                    ) * 12
                }px`;

            star.style.top =
                `${
                    y +
                    (
                        Math.random() -
                        0.5
                    ) * 12
                }px`;

            star.style.setProperty(
                "--size",
                `${size}px`
            );

            star.style.setProperty(
                "--move-x",
                `${
                    (
                        Math.random() -
                        0.5
                    ) * spread
                }px`
            );

            star.style.setProperty(
                "--move-y",
                `${
                    (
                        Math.random() -
                        0.5
                    ) * spread - 10
                }px`
            );

            star.style.setProperty(
                "--duration",
                `${duration}ms`
            );

            document.body.appendChild(
                star
            );

            star.addEventListener(
                "animationend",
                () => star.remove(),
                {
                    once: true
                }
            );
        }
    </script>
</body>
</html>
