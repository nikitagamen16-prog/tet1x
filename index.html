    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px 90px;

            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: #ffffff;
            text-align: center;

            /* Новогодний ночной фон: глубокий хвойно-изумрудный и бордовый градиент с тёплыми огнями */
            background:
                radial-gradient(circle at 18% 20%, rgba(220, 38, 38, 0.34), transparent 36%),
                radial-gradient(circle at 82% 25%, rgba(245, 158, 11, 0.25), transparent 38%),
                radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.22), transparent 44%),
                linear-gradient(145deg, #071915 0%, #160912 52%, #05110e 100%);
        }

        /* Декоративная гирлянда сверху экрана */
        .garland {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 4;
            height: 28px;
            display: flex;
            justify-content: space-around;
            align-items: flex-start;
            pointer-events: none;
            border-top: 2px solid rgba(255, 215, 130, 0.28);
        }

        .garland span {
            width: 10px;
            height: 16px;
            border-radius: 50% 50% 50% 50% / 35% 35% 65% 65%;
            margin-top: -2px;
            animation: bulbTwinkle 1.8s ease-in-out infinite alternate;
        }

        .garland span:nth-child(4n + 1) {
            background: #ff4d4d;
            box-shadow: 0 4px 16px #ff4d4d, 0 0 28px rgba(255, 77, 77, 0.8);
            animation-delay: 0s;
        }

        .garland span:nth-child(4n + 2) {
            background: #ffd166;
            box-shadow: 0 4px 16px #ffd166, 0 0 28px rgba(255, 209, 102, 0.8);
            animation-delay: 0.45s;
        }

        .garland span:nth-child(4n + 3) {
            background: #34d399;
            box-shadow: 0 4px 16px #34d399, 0 0 28px rgba(52, 211, 153, 0.8);
            animation-delay: 0.9s;
        }

        .garland span:nth-child(4n + 4) {
            background: #60a5fa;
            box-shadow: 0 4px 16px #60a5fa, 0 0 28px rgba(96, 165, 250, 0.8);
            animation-delay: 1.35s;
        }

        @keyframes bulbTwinkle {
            0% {
                opacity: 0.45;
                transform: scale(0.92);
            }
            100% {
                opacity: 1;
                transform: scale(1.08);
            }
        }

            position: fixed;
            inset: 0;
            z-index: 1;

            width: 100%;
            height: 100%;

            pointer-events: none;
        }
