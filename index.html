<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Одноразовый 2FA-код — BoYm Funpay</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            text-align: center;
            background: #000000;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0 0 30px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #label {
            font-size: 1.4rem;
            opacity: 0.9;
            margin-bottom: 40px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        #label a {
            color: #ffffff;
            text-decoration: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.5);
            transition:
                opacity 0.2s ease,
                border-color 0.2s ease;
        }

        #label a:hover {
            opacity: 0.8;
            border-bottom-color: #ffffff;
        }

        #label a:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 5px;
            border-radius: 3px;
        }

        #code {
            font-size: 5.5rem;
            font-weight: bold;
            letter-spacing: 12px;
            margin: 40px 0 30px;
            min-height: 100px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-shadow:
                0 0 30px rgba(255, 255, 255, 0.8),
                0 0 60px rgba(255, 255, 255, 0.4);

            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%,
            100% {
                text-shadow:
                    0 0 30px rgba(255, 255, 255, 0.8),
                    0 0 60px rgba(255, 255, 255, 0.4);
            }

            50% {
                text-shadow:
                    0 0 40px rgba(255, 255, 255, 1),
                    0 0 80px rgba(255, 255, 255, 0.6);
            }
        }

        #countdown {
            font-size: 1.4rem;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .progress {
            height: 8px;
            background: #222222;
            margin: 20px auto;
            width: min(320px, 100%);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #ffffff, #cccccc);
            transition: width 1s linear;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        #copy-btn {
            margin-top: 20px;
            padding: 14px 32px;

            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;

            background-color: #ffffff;
            color: #000000;

            border: 2px solid #ffffff;
            border-radius: 8px;

            cursor: pointer;

            transition:
                background-color 0.3s ease-in-out,
                color 0.3s ease-in-out,
                transform 0.3s ease-in-out,
                box-shadow 0.3s ease-in-out;

            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.2);
            animation: buttonIntro 0.5s ease-out;
        }

        #copy-btn:hover {
            background-color: transparent;
            color: #ffffff;
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.4);
        }

        #copy-btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 8px rgba(255, 255, 255, 0.2);
        }

        #copy-btn:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 5px;
        }

        @keyframes buttonIntro {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .error {
            color: #ff6b6b;
            margin-top: 20px;
            min-height: 24px;
            font-size: 1rem;
        }

        .success {
            color: #51cf66;
            margin-top: 10px;
            min-height: 24px;
            font-size: 1rem;
        }

        .success.visible {
            animation: fadeInOut 2s ease-in-out;
        }

        @keyframes fadeInOut {
            0%,
            100% {
                opacity: 0;
            }

            10%,
            90% {
                opacity: 1;
            }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            #label {
                font-size: 1.2rem;
            }

            #code {
                font-size: 3.5rem;
                letter-spacing: 8px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Одноразовый 2FA-код</h1>

        <div id="label">
            <a
                href="https://funpay.com/users/2176322/"
                target="_blank"
                rel="noopener noreferrer"
            >
                BoYm - Funpay
            </a>
        </div>

        <div id="code" aria-live="polite">------</div>

        <div class="progress">
            <div id="bar" class="bar"></div>
        </div>

        <div id="countdown">
            Обновление через <span id="time">30</span> сек.
        </div>

        <button id="copy-btn" type="button">
            Копировать
        </button>

        <div id="error" class="error" aria-live="assertive"></div>
        <div id="success" class="success" aria-live="polite"></div>
    </main>

    <script>
        // ==================== НАСТРОЙКИ ====================

        // Вставьте сюда секретный ключ 2FA в формате Base32.
        const secretBase32 = "CWNQVHWMCKGZ7GGGDDGQHWXAO5HXBIM3";

        // ==================================================

        const codeElement = document.getElementById("code");
        const timeElement = document.getElementById("time");
        const barElement = document.getElementById("bar");
        const copyButton = document.getElementById("copy-btn");
        const errorElement = document.getElementById("error");
        const successElement = document.getElementById("success");

        copyButton.addEventListener("click", copyCode);

        async function copyCode() {
            const code = codeElement.textContent.trim();

            if (!/^\d{6}$/.test(code)) {
                showError("Код ещё не готов.");
                return;
            }

            try {
                await navigator.clipboard.writeText(code);

                showSuccess("Код скопирован.");
                copyButton.textContent = "Скопировано!";

                setTimeout(() => {
                    copyButton.textContent = "Копировать";
                }, 2000);
            } catch (error) {
                console.error(error);
                showError("Не удалось скопировать код.");
            }
        }

        function showError(message) {
            errorElement.textContent = message;

            setTimeout(() => {
                errorElement.textContent = "";
            }, 3000);
        }

        function showSuccess(message) {
            successElement.classList.remove("visible");
            successElement.textContent = message;

            void successElement.offsetWidth;

            successElement.classList.add("visible");

            setTimeout(() => {
                successElement.textContent = "";
                successElement.classList.remove("visible");
            }, 2000);
        }

        function normalizeBase32(base32) {
            return base32
                .toUpperCase()
                .replace(/\s+/g, "")
                .replace(/=+$/g, "");
        }

        function base32ToBuffer(base32) {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            const normalized = normalizeBase32(base32);

            if (!normalized) {
                throw new Error("Секретный ключ не указан.");
            }

            let bits = "";

            for (const character of normalized) {
                const value = alphabet.indexOf(character);

                if (value === -1) {
                    throw new Error(
                        `Недопустимый символ в секретном ключе: ${character}`
                    );
                }

                bits += value.toString(2).padStart(5, "0");
            }

            const byteLength = Math.floor(bits.length / 8);
            const bytes = new Uint8Array(byteLength);

            for (let i = 0; i < byteLength; i++) {
                const byteBits = bits.slice(i * 8, i * 8 + 8);
                bytes[i] = parseInt(byteBits, 2);
            }

            return bytes;
        }

        async function generateTOTP(secret) {
            const keyData = base32ToBuffer(secret);

            const epochSeconds = Math.floor(Date.now() / 1000);
            const counter = Math.floor(epochSeconds / 30);

            const counterBuffer = new ArrayBuffer(8);
            const counterView = new DataView(counterBuffer);

            counterView.setBigUint64(
                0,
                BigInt(counter),
                false
            );

            const cryptoKey = await crypto.subtle.importKey(
                "raw",
                keyData,
                {
                    name: "HMAC",
                    hash: "SHA-1"
                },
                false,
                ["sign"]
            );

            const signature = await crypto.subtle.sign(
                "HMAC",
                cryptoKey,
                counterBuffer
            );

            const hmac = new Uint8Array(signature);
            const offset = hmac[hmac.length - 1] & 0x0f;

            const binaryCode =
                ((hmac[offset] & 0x7f) << 24) |
                ((hmac[offset + 1] & 0xff) << 16) |
                ((hmac[offset + 2] & 0xff) << 8) |
                (hmac[offset + 3] & 0xff);

            return String(binaryCode % 1000000).padStart(6, "0");
        }

        async function update() {
            const now = Math.floor(Date.now() / 1000);
            const remaining = 30 - (now % 30);

            timeElement.textContent = remaining;
            barElement.style.width = `${(remaining / 30) * 100}%`;

            try {
                const code = await generateTOTP(secretBase32);

                codeElement.textContent = code;
                errorElement.textContent = "";
            } catch (error) {
                codeElement.textContent = "------";
                errorElement.textContent = `Ошибка: ${error.message}`;

                console.error(error);
            }
        }

        update();
        setInterval(update, 1000);
    </script>
</body>
</html>
